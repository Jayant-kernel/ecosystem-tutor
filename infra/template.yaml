AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Ecosystem voice backend — custom pipeline:
  microphone -> ElevenLabs STT -> Amazon Bedrock (Claude 3 Haiku)
  -> ElevenLabs TTS -> speaker. No ElevenLabs Conversational AI Agent.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 29
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Parameters:
  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Description: ElevenLabs API key (xi-api-key). Server-side only; never sent to the client.
  ElevenLabsVoiceId:
    Type: String
    Default: y0IUmXZMBt1M9uXCVcPL
    Description: ElevenLabs voice id used for TTS (no agent required).
  TtsProvider:
    Type: String
    Default: sarvam
    AllowedValues:
      - elevenlabs
      - sarvam
    Description: TTS provider for the spoken tutor voice.
  SarvamApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Sarvam API subscription key. Server-side only; used when TtsProvider=sarvam.
  SarvamTtsModel:
    Type: String
    Default: bulbul:v3
    Description: Sarvam text-to-speech model.
  SarvamTtsSpeaker:
    Type: String
    Default: shubh
    Description: Sarvam TTS speaker. Use lowercase names, e.g. shubh, rahul, amit.
  SarvamTtsLanguageCode:
    Type: String
    Default: en-IN
    Description: Sarvam TTS language code.
  SarvamTtsOutputAudioCodec:
    Type: String
    Default: mp3
    Description: Sarvam TTS output audio codec.
  SarvamTtsSampleRate:
    Type: String
    Default: '24000'
    Description: Sarvam TTS sample rate.
  SarvamTtsPace:
    Type: String
    Default: '0.88'
    Description: Sarvam TTS pace, 0.5-2.0. Below 1 is calmer for teaching.
  SarvamTtsTemperature:
    Type: String
    Default: '0.6'
    Description: Sarvam TTS temperature, 0.01-2.0.
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Gemini API key. Used only inside the Lambda (temporary LLM). Never sent to the browser.
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: OpenAI API key. Server-side only; never sent to the browser.
  OpenAIModelId:
    Type: String
    Default: gpt-4o-mini
    Description: OpenAI model id used by the primary tutor provider.
  GeminiModelId:
    Type: String
    Default: gemini-2.5-flash
    Description: Gemini model id used as the temporary tutor brain.
  LlmProvider:
    Type: String
    Default: openai
    AllowedValues:
      - openai
      - groq
      - grok
      - gemini
      - bedrock
    Description: Primary LLM provider for the tutor.
  LlmFallbackProvider:
    Type: String
    Default: groq,gemini
    Description: >-
      Providers tried in order when the primary fails (rate limit, outage, bad
      key). Accepts a comma-separated chain, e.g. "groq,gemini".
      Set to 'none' to disable fallback.
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Groq API key (console.groq.com). Server-side only.
  GroqModelId:
    Type: String
    Default: openai/gpt-oss-20b
    Description: Groq model id used when LlmProvider=groq.
  GroqReasoningEffort:
    Type: String
    Default: low
    Description: Reasoning effort for gpt-oss models (low keeps spoken replies fast).
  GrokApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: xAI (Grok) API key. Server-side only; never sent to the browser.
  GrokModelId:
    Type: String
    Default: grok-4-fast
    Description: xAI Grok model id. Confirm the exact name available to your key.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Bedrock model id used when LlmProvider=bedrock.
  BedrockRegion:
    Type: String
    Default: ap-south-1
    Description: AWS region that serves the Bedrock model.
  SttModelId:
    Type: String
    Default: scribe_v2
    Description: ElevenLabs speech-to-text model id.
  TtsModelId:
    Type: String
    Default: eleven_turbo_v2_5
    Description: >-
      ElevenLabs text-to-speech model. eleven_turbo_v2_5 is fast AND expressive
      (emotion); eleven_flash_v2_5 is the fastest but flatter; eleven_multilingual_v2
      is the most expressive but slower.
  TtsOutputFormat:
    Type: String
    Default: mp3_44100_64
    Description: TTS output format. Lower bitrate = smaller payload = less latency.
  TtsSpeed:
    Type: String
    Default: '0.88'
    Description: Speech rate, 0.7-1.2. Below 1 is slower. Lower it for a calmer tutor.
  TtsStability:
    Type: String
    Default: '0.3'
    Description: 0-1. Lower is more expressive and varied (more emotion).
  TtsStyle:
    Type: String
    Default: '0.45'
    Description: 0-1. Higher exaggerates the voice's style (more emotion).
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS origin for browser access (set to your Amplify URL in production).

Resources:

  # ---- API Gateway for browser-facing endpoints (/voice, /session, /intro, /execute) ----
  BackendApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      BinaryMediaTypes:
        - multipart/form-data
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"

  # ---- Voice pipeline: POST /voice (STT -> LLM -> TTS), POST /intro (text -> LLM -> TTS), GET /session ----
  LlmBridgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/llm-bridge/
      Handler: index.handler
      MemorySize: 1024
      Timeout: 29
      Environment:
        Variables:
          ELEVENLABS_API_KEY: !Ref ElevenLabsApiKey
          ELEVENLABS_VOICE_ID: !Ref ElevenLabsVoiceId
          TTS_PROVIDER: !Ref TtsProvider
          SARVAM_API_KEY: !Ref SarvamApiKey
          SARVAM_TTS_MODEL: !Ref SarvamTtsModel
          SARVAM_TTS_SPEAKER: !Ref SarvamTtsSpeaker
          SARVAM_TTS_LANGUAGE_CODE: !Ref SarvamTtsLanguageCode
          SARVAM_TTS_OUTPUT_AUDIO_CODEC: !Ref SarvamTtsOutputAudioCodec
          SARVAM_TTS_SAMPLE_RATE: !Ref SarvamTtsSampleRate
          SARVAM_TTS_PACE: !Ref SarvamTtsPace
          SARVAM_TTS_TEMPERATURE: !Ref SarvamTtsTemperature
          LLM_PROVIDER: !Ref LlmProvider
          LLM_FALLBACK_PROVIDER: !Ref LlmFallbackProvider
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_MODEL_ID: !Ref OpenAIModelId
          GROQ_API_KEY: !Ref GroqApiKey
          GROQ_MODEL_ID: !Ref GroqModelId
          GROQ_REASONING_EFFORT: !Ref GroqReasoningEffort
          GROK_API_KEY: !Ref GrokApiKey
          GROK_MODEL_ID: !Ref GrokModelId
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL_ID: !Ref GeminiModelId
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
          STT_MODEL_ID: !Ref SttModelId
          TTS_MODEL_ID: !Ref TtsModelId
          TTS_OUTPUT_FORMAT: !Ref TtsOutputFormat
          TTS_SPEED: !Ref TtsSpeed
          TTS_STABILITY: !Ref TtsStability
          TTS_STYLE: !Ref TtsStyle
          SESSION_TTL_MS: '1800000'
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:${BedrockRegion}::foundation-model/${BedrockModelId}'
      Events:
        Voice:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /voice
            Method: POST
        Session:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /session
            Method: GET
        Intro:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /intro
            Method: POST

  # ---- Server-side code execution sandbox (POST /execute) ----
  ExecuteCodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/execute-code/
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          EXEC_TIMEOUT_MS: '2000'
      Events:
        PostExecute:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /execute
            Method: POST

Outputs:
  ApiBaseUrl:
    Description: Set this as VITE_API_BASE_URL for the frontend build.
    Value: !Sub 'https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
