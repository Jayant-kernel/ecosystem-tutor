name: Deploy Lambda backend

# Deploys the AWS SAM backend in infra/ on every push to main.
# Frontend code is never built or deployed by this workflow.
#
# Manual run: GitHub repo -> Actions -> "Deploy Lambda backend" -> Run workflow.
# Manual runs always run the full pipeline, even if no infra/ files changed.

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:

# Least privilege: OIDC needs id-token:write, checkout needs contents:read.
permissions:
  contents: read
  id-token: write

# Serialise deployments so two pushes can never deploy concurrently.
concurrency:
  group: deploy-lambda-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1 # must match infra/samconfig.toml and infra/template.yaml defaults
  SAM_STACK_NAME: sam-app # must match infra/samconfig.toml (stack_name)
  SAM_TEMPLATE: infra/template.yaml
  NODE_VERSION: '20' # must match the Lambda runtime nodejs20.x

jobs:
  build-test-deploy:
    name: Test, build and deploy Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/src/llm-bridge/package-lock.json

      - name: Install application test dependencies
        # The visual-tutor logic test compiles its small TypeScript-only
        # modules with this project's pinned TypeScript version.
        run: npm ci

      - name: Install Lambda dependencies
        working-directory: infra/src/llm-bridge
        run: npm ci

      - name: Run backend tests
        # Root `npm test` runs `node --test`, which discovers infra/test/*.test.mjs.
        # External APIs (ElevenLabs/Bedrock/Gemini) are mocked — no real calls, no secrets needed.
        run: npm test

      - name: Diagnose OIDC token (TEMPORARY)
        # TEMPORARY debugging for "web identity token could not be validated".
        # Requests the GitHub OIDC JWT and prints ONLY these payload claims:
        # iss, aud, sub, repository, repository_id, repository_owner,
        # repository_owner_id, ref, event_name — plus GITHUB_REPOSITORY,
        # GITHUB_REF and GITHUB_EVENT_NAME.
        # The raw JWT, request token, Authorization header and signature are
        # never printed, uploaded or stored. Remove this step after debugging.
        run: |
          set -euo pipefail
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          resp=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_JWT="$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          OIDC_JWT="${OIDC_JWT}" python3 - <<'EOF'
          import base64
          import json
          import os
          payload = os.environ['OIDC_JWT'].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ('iss', 'aud', 'sub', 'repository', 'repository_id',
                      'repository_owner', 'repository_owner_id', 'ref', 'event_name'):
              print(f'{key}={claims.get(key)}')
          EOF

      - name: Diagnose STS assume-role (TEMPORARY)
        # TEMPORARY debugging: calls AWS STS directly with the GitHub OIDC JWT
        # to isolate the configure-aws-credentials failure (provider/token
        # validation vs audience vs trust-policy vs role-ARN mismatch).
        # Only the AWS exit code and AWS error message are printed. The JWT,
        # request token, Authorization header and any credentials are never
        # printed, uploaded or stored. Remove this step after debugging.
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -uo pipefail
          echo "AWS account ID expected: 873461662097"
          echo "Role ARN being tested: ${AWS_DEPLOY_ROLE_ARN}"
          role_account_id="$(printf '%s' "${AWS_DEPLOY_ROLE_ARN}" | cut -d':' -f5)"
          echo "Role account ID under test: ${role_account_id}"
          resp=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_JWT="$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "${OIDC_JWT}" ]; then
            echo "STS diagnostic aborted: empty OIDC JWT (token request failed)"
            exit 1
          fi
          out_file="$(mktemp)"
          err_file="$(mktemp)"
          if aws sts assume-role-with-web-identity \
            --role-arn "${AWS_DEPLOY_ROLE_ARN}" \
            --role-session-name "github-oidc-diagnostic" \
            --web-identity-token "${OIDC_JWT}" \
            --region ap-south-1 >"${out_file}" 2>"${err_file}"; then
            echo "STS exit code: 0"
            echo "STS assume-role succeeded; credentials withheld from logs."
          else
            code=$?
            echo "STS exit code: ${code}"
            echo "STS error:"
            cat "${err_file}"
          fi
          rm -f "${out_file}" "${err_file}"

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-lambda-${{ github.sha }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build with SAM
        run: sam build --template ${{ env.SAM_TEMPLATE }}

      - name: Deploy with SAM
        # Idempotent CloudFormation update: preserves the Lambda function names,
        # API Gateway, IAM roles, memory/timeout, runtime and architecture defined
        # in infra/template.yaml. Secrets come from GitHub Secrets, never the repo.
        #
        # Required secrets are passed through env and guarded with ${VAR:?...}.
        # A secret that does not exist expands to an empty string, which SAM
        # rejects with a confusing "ParameterKey= is not a valid format"; this
        # fails with a readable message instead.
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${{ env.SAM_STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ElevenLabsApiKey="${ELEVENLABS_API_KEY:?ELEVENLABS_API_KEY secret is not set}" \
              ElevenLabsVoiceId="${ELEVENLABS_VOICE_ID:-y0IUmXZMBt1M9uXCVcPL}" \
              TtsProvider=sarvam \
              SarvamApiKey="${SARVAM_API_KEY:?SARVAM_API_KEY secret is not set}" \
              SarvamTtsModel=bulbul:v3 \
              SarvamTtsSpeaker=shubh \
              SarvamTtsLanguageCode=en-IN \
              SarvamTtsOutputAudioCodec=mp3 \
              SarvamTtsSampleRate=24000 \
              SarvamTtsPace=0.88 \
              SarvamTtsTemperature=0.6 \
              GeminiApiKey="${GEMINI_API_KEY:?GEMINI_API_KEY secret is not set}" \
              GroqApiKey="${GROQ_API_KEY:?GROQ_API_KEY secret is not set}" \
              OpenAIApiKey="${OPENAI_API_KEY:?OPENAI_API_KEY secret is not set}" \
              LlmProvider=openai \
              LlmFallbackProvider=groq,gemini \
              OpenAIModelId=gpt-4o-mini \
              GroqModelId=openai/gpt-oss-20b \
              GroqReasoningEffort=low \
              TtsModelId=eleven_turbo_v2_5 \
              TtsOutputFormat=mp3_44100_64 \
              TtsSpeed=0.88 \
              TtsStability=0.3 \
              TtsStyle=0.45
